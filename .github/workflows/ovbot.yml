name: ovbot

on:
  push:
    branches: [ python3 ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:

      - uses: actions/checkout@v6
        with:
          ref: 'python3'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Build python 3.14
        run: |
          sudo apt-get -q update
          sudo apt-get install dos2unix
          pip install --upgrade pip autopep8 future 2to3
          chmod -R 777 CI && ./CI/build.sh
